name: Deploy frontend to VPS

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ro-intel.xyz
          username: root
          key: ${{ secrets.VPS_DEPLOY_KEY }}
          command_timeout: 20m
          script: |
            set -e
            # /root/ro-intel is a symlink to /srv/ro-intel once
            # deploy/vps/harden.sh (root repo) has run; the path works either way.
            cd /root/ro-intel/romania-intel-frontend
            # fetch + checkout rather than pull: this directory is also the
            # monorepo's submodule, so it can be on a detached HEAD.
            # Untracked files (.env.production) are kept.
            git fetch -q origin main
            git checkout -q -f -B main origin/main
            git log --oneline -1
            # Builds into .next-staging while the live build keeps serving,
            # swaps it in, restarts, and rolls back if the new build does not
            # answer. `scripts/deploy-build.sh rollback` undoes a deploy by hand.
            bash scripts/deploy-build.sh
